spring:
  application:
    name: ecom-application
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:test
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

#Actuator management - some endpoints were enabled for learning purpose
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env, loggers
  endpoint:
    health:
      show-details: always
  info:
      env:
        enabled: true
server:
  shutdown: graceful
info:
  app:
    name: My e-commerce project
    description: Just a simple app
    version: 1.0.0

